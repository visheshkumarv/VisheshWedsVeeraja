name: Auto-build static files

# Run when source code changes. Build the React app online and commit the
# built files (index.html, static/, plus any public assets like DSC07099.jpg)
# back to main, so GitHub Pages "Deploy from branch → main / root" picks them up.

on:
  push:
    branches: [main]
    paths:
      - "frontend/src/**"
      - "frontend/public/**"
      - "frontend/package.json"
      - "frontend/yarn.lock"
      - "frontend/tailwind.config.js"
      - "frontend/postcss.config.js"
      - "frontend/craco.config.js"
      - ".github/workflows/build-and-commit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build React app
        working-directory: frontend
        run: yarn build

      - name: Copy build output to repo root
        run: |
          # Remove previous build artifacts from root (keep source folders intact)
          rm -rf static asset-manifest.json index.html

          # Copy ALL build outputs (index.html, static/, plus public assets
          # like DSC07099.jpg, favicon.ico, etc.) to repo root.
          cp -r frontend/build/. .

          # Ensure GitHub Pages serves files literally (no Jekyll processing)
          touch .nojekyll

          echo "Files at root after copy:"
          ls -la | head -30

      - name: Commit changes back to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A index.html static asset-manifest.json .nojekyll DSC07099.jpg favicon.ico manifest.json robots.txt 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes in built files — nothing to commit."
          else
            git commit -m "chore: auto-build static files [skip ci]"
            git push
            echo "Built files committed and pushed to main."
          fi
